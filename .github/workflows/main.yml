name: Build Magisk Module

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      package_name:
        description: "Nama package aplikasi/game (opsional)"
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11

      - name: Install dependencies (CMake, Ninja, dsb)
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build

      - name: Build Native Library dengan Gradle
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease

      # Jika ingin ganti package_name di file, aktifkan langkah ini:
      - name: Ganti package name (opsional)
        if: ${{ github.event.inputs.package_name != '' }}
        run: |
          sed -i "s/com.game.packagename/${{ github.event.inputs.package_name }}/g" module/src/main/cpp/game.h

      # Ubah path sesuai hasil build Magisk module kamu!
      - name: Buat ZIP Magisk Module
        run: zip -r9 magisk-module.zip out/magisk_module_release/*

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: magisk-module
          path: magisk-module.zip
