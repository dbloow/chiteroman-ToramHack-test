name: Build Magisk Module

on:
  workflow_dispatch:
    inputs:
      package_name:
        description: "Nama package aplikasi/game (opsional)"
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11

      - name: Install CMake & Ninja
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build

      # (Opsional) Ganti package_name di file tertentu
      - name: Ganti package name (opsional)
        if: ${{ github.event.inputs.package_name != '' }}
        run: |
          sed -i "s/com.game.packagename/${{ github.event.inputs.package_name }}/g" module/src/main/cpp/game.h

      # Build via gradle, sesuaikan task-nya jika perlu
      - name: Build dengan Gradle
        run: |
          chmod +x ./gradlew
          ./gradlew :module:assembleRelease

      # ZIP hasil build, BUKAN seluruh repo!
      - name: Zip Magisk Module Release Output
        run: zip -r9 magisk_module_release.zip out/magisk_module_release/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: magisk-module
          path: magisk_module_release.zip